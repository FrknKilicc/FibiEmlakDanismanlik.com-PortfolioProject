# Fibi Emlak - nginx ters vekil (reverse proxy) yapılandırması
# Kurulum: /etc/nginx/sites-available/fibi.conf, ardından sites-enabled'a bağlanır.
# HTTPS satırlarını certbot --nginx otomatik ekler; bu dosya HTTP ile başlar.
#
# Uygulamalar yalnızca 127.0.0.1'de dinler; dışarıya sadece nginx (80/443) açıktır.
#   WebApi  127.0.0.1:5000  (dışarıya kapalı; yalnızca /uploads görselleri buradan sunulur)
#   Site    127.0.0.1:5001  fibiemlak.com, www.fibiemlak.com
#   Panel   127.0.0.1:5002  panel.fibiemlak.com

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# Ortak vekil başlıkları: uygulamalar gerçek ziyaretçi IP'sini ve https bilgisini görür
# (ForwardedHeaders yalnızca 127.0.0.1'den gelen başlıklara güvenir).
upstream fibi_api   { server 127.0.0.1:5000; keepalive 16; }
upstream fibi_site  { server 127.0.0.1:5001; keepalive 16; }
upstream fibi_panel { server 127.0.0.1:5002; keepalive 16; }

# Sunucu sürümünü gizle
server_tokens off;

# --- Ana site ---
server {
    listen 80;
    listen [::]:80;
    # yeni.fibiemlak.com: DNS geçişinden önce canlı ortamı gerçek HTTPS ile denemek için geçici adres
    server_name fibiemlak.com www.fibiemlak.com yeni.fibiemlak.com;

    client_max_body_size 2m;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(self)" always;

    # Geçici deneme adresi arama motorlarında indekslenmesin
    set $robots_header "";
    if ($host = yeni.fibiemlak.com) { set $robots_header "noindex, nofollow"; }
    add_header X-Robots-Tag $robots_header always;

    # www -> çıplak alan adı (tek adres, SEO için)
    if ($host = www.fibiemlak.com) {
        return 301 https://fibiemlak.com$request_uri;
    }

    # İlan ve içerik görselleri WebApi'nin /uploads klasöründen gelir
    location /uploads/ {
        proxy_pass http://fibi_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        limit_except GET HEAD { deny all; }
    }

    # WebApi uçları dışarıya kapalı (site sunucu tarafında 127.0.0.1 üzerinden çağırır)
    location /api/ { return 404; }

    location / {
        proxy_pass http://fibi_site;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}

# --- Yönetim paneli ---
server {
    listen 80;
    listen [::]:80;
    server_name panel.fibiemlak.com;

    # İlan fotoğrafları toplu yüklenir (uygulama sınırı 320 MB)
    client_max_body_size 330m;
    client_body_timeout 300s;

    add_header X-Robots-Tag "noindex, nofollow" always;

    location / {
        proxy_pass http://fibi_panel;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_request_buffering off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}

# --- İkinci alan adı: fibiemlak.online -> fibiemlak.com ---
server {
    listen 80;
    listen [::]:80;
    server_name fibiemlak.online www.fibiemlak.online;
    return 301 https://fibiemlak.com$request_uri;
}

# --- Tanımsız host / IP ile gelen istekler ---
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    return 444;
}
