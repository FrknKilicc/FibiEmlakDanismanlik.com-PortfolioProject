# Fibi Emlak: dev ve master'a açılan her PR'da derleme + birim testleri.
# Persistence testleri LocalDB istediği için burada değil, yerelde çalıştırılır.
name: CI

on:
  pull_request:
    branches: [dev, master]

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Derle
        run: dotnet build FibiEmlakDanismanlik.sln -c Release
      - name: Birim testleri
        run: dotnet test Tests/FibiEmlakDanismanlik.Unit.Tests -c Release --no-build
